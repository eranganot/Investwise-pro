[project]
name = "investwise-pro"
version = "22.1.0"
description = "InvestWise Pro - Multi-Agent Wealth Operating System"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Pinned so the fixture loop scope stops being a deprecation warning on every
# async test. "function" is what pytest-asyncio will default to anyway; saying
# it now means the change lands as a no-op instead of as a surprise.
asyncio_default_fixture_loop_scope = "function"
