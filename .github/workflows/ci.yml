name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR 94: GitHub created TWO runs for the single push of bea66a2 (#273/#274,
# same commit, same event, same second). One run per commit per event is the
# contract; a duplicate cancels the older one instead of doubling the minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # O6 (D143): no SQLite job. Postgres is the gate (PR 145); SQLite proved less than it
  # looked (incident 5a6dfef) and cost ~9 runner-minutes per run.
  test-postgres:
    runs-on: ubuntu-latest
    # IW-6: a hung test (a scheduler thread, a stuck socket) used to burn the
    # default 6 hours of minutes; the suite takes ~16 min on Postgres.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: investwise
          POSTGRES_PASSWORD: investwise
          POSTGRES_DB: investwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://investwise:investwise@localhost:5432/investwise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned ruff (via requirements-dev) so lint is reproducible and can be a
      # real gate rather than silently drifting red under a floating latest.
      - run: pip install -r requirements-dev.txt
      # `tests` is gated too. It used to be `app` only, and tests/ quietly
      # accumulated 28 errors nobody saw -- the next phase should not be able
      # to add a 29th.
      - run: ruff check app tests
